plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '6.1.0'
}

group 'de.labystudio'
version '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

project.ext.lwjglVersion = "3.4.0-SNAPSHOT"
project.ext.jomlVersion = "1.10.8"

repositories {
    mavenCentral()
    maven { url "https://central.sonatype.com/repository/maven-snapshots" }
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"
    implementation "org.lwjgl:lwjgl-stb"

    // Linux natives
    implementation "org.lwjgl:lwjgl::natives-linux"
    implementation "org.lwjgl:lwjgl-glfw::natives-linux"
    implementation "org.lwjgl:lwjgl-opengl::natives-linux"
    implementation "org.lwjgl:lwjgl-stb::natives-linux"

    // Windows natives
    implementation "org.lwjgl:lwjgl::natives-windows"
    implementation "org.lwjgl:lwjgl-glfw::natives-windows"
    implementation "org.lwjgl:lwjgl-opengl::natives-windows"
    implementation "org.lwjgl:lwjgl-stb::natives-windows"

    implementation "org.joml:joml:${jomlVersion}"

    // NBT
    implementation 'com.github.Steveice10:opennbt:1.3'
}

application {
    mainClass = 'de.labystudio.game.Minecraft'
//    applicationDefaultJvmArgs = ['-XstartOnFirstThread'] // Required for macOS
}

jar {
    manifest {
        attributes 'Main-Class': 'de.labystudio.game.Minecraft'
    }
}

shadowJar {
    archiveBaseName.set('java-minecraft')
    archiveClassifier.set('all')
    archiveVersion.set(project.version.toString())

    manifest {
        attributes 'Main-Class': 'de.labystudio.game.Minecraft'
    }

    mergeServiceFiles()

    // Fix for shadow plugin compatibility
    mainClassName = 'de.labystudio.game.Minecraft'
}

// Task to run the game
task runGame(type: JavaExec) {
    mainClass = 'de.labystudio.game.Minecraft'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = file('run')
    
    // macOS specific
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs '-XstartOnFirstThread'
    }
}